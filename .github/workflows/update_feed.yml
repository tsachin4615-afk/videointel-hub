name: Update Video Feed

on:
  schedule:
    # Runs every 2 hours: at minute 15 of every even hour (UTC)
    - cron: '15 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch_and_update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests python-dateutil

      - name: Fetch Channel Intelligence
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python fetch_videos.py

      - name: Commit and Push Updated Feed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add videos.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update intelligence feed [skip ci]" && git push)
