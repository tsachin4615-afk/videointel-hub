name: Update Video Feed & AI Summaries

on:
  schedule:
    # Runs automatically every 2 hours
    - cron: '15 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch_and_summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests python-dateutil

      - name: Harvest Videos & Generate Layman Summaries
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python fetch_videos.py

      - name: Commit and Push Any Updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add videos.json cycles.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update feed and cycle telemetry [skip ci]" && git push)
