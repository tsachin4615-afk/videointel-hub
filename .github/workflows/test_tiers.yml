name: Test All Tiers Separately

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Choose which tier to test across all channels"
        required: true
        default: "yt_html"
        type: choice
        options:
          - rss
          - yt_dlp
          - yt_html
          - mirrors

jobs:
  test-tier:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade scrapetube yt-dlp

      - name: Verify scrapetube
        run: |
          python -c "import scrapetube; print('SCRAPETUBE_OK')"

      - name: Run selected tier test
        run: |
          python -u scripts/test_tiers.py ${{ inputs.tier }}
