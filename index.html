<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoIntel Hub | Multi-Tier AI Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b0f19; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .card-glow { transition: all 0.25s ease; border: 1px solid #1e293b; }
    .card-glow:hover { border-color: #38bdf8; transform: translateY(-2px); }
    .pill-btn { transition: all 0.15s ease; }
    .pill-btn:active { transform: scale(0.96); }
    select { appearance: none; -webkit-appearance: none; }
  </style>
</head>
<body class="min-h-screen pb-20">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-[#0f172a]/95 backdrop-blur-md border-b border-slate-800 px-4 py-3 sm:px-8">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="h-9 w-9 rounded-lg bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
          <i class="fa-solid fa-brain text-lg"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-white tracking-tight flex items-center gap-2">
            VideoIntel Hub
            <span class="text-xs font-semibold px-2 py-0.5 rounded bg-indigo-950 text-indigo-400 border border-indigo-800">Advanced Engine Suite</span>
          </h1>
          <p class="text-xs text-slate-400">Current Affairs & Competitive Exam Intelligence</p>
        </div>
      </div>

      <!-- Controls: Engine Selector, Thinking Level & API Key -->
      <div class="flex flex-wrap items-center gap-2">
        <!-- Engine Selection -->
        <div class="relative">
          <select id="engineSelector" onchange="saveEnginePreference()" class="text-xs bg-slate-900 border border-slate-700 text-indigo-300 pl-3 pr-7 py-1.5 rounded-lg focus:outline-none focus:border-indigo-500">
            <option value="gemini-3.8-flash" selected>3.8 Flash (All-around help)</option>
            <option value="gemini-3.5-flash-lite">3.5 Flash-Lite (Quick answers)</option>
            <option value="gemini-3.1-pro">3.1 Pro (Detailed research)</option>
            <option value="gemini-4-argon">4 Argon (Code & analysis)</option>
          </select>
          <i class="fa-solid fa-chevron-down absolute right-2.5 top-2.5 text-[10px] text-slate-500 pointer-events-none"></i>
        </div>

        <!-- Thinking Level Selection -->
        <div class="relative">
          <select id="thinkingLevel" onchange="saveThinkingPreference()" class="text-xs bg-slate-900 border border-slate-700 text-emerald-400 pl-3 pr-7 py-1.5 rounded-lg focus:outline-none focus:border-indigo-500">
            <option value="low" selected>Low (Fast & efficient)</option>
            <option value="medium">Medium (Balanced depth)</option>
            <option value="high">High (Extra thorough)</option>
          </select>
          <i class="fa-solid fa-chevron-down absolute right-2.5 top-2.5 text-[10px] text-slate-500 pointer-events-none"></i>
        </div>

        <!-- API Key Manager -->
        <button onclick="promptApiKey()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-1.5 transition">
          <i class="fa-solid fa-key text-amber-400"></i>
          <span id="keyStatusLabel">Set Gemini Key</span>
        </button>

        <span id="countBadge" class="text-xs bg-indigo-950 text-indigo-300 border border-indigo-800 px-2.5 py-1 rounded-full font-medium">Loading...</span>
      </div>
    </div>
  </header>

  <!-- Master AI Engine (Global Command Center) -->
  <section class="max-w-7xl mx-auto px-4 sm:px-8 pt-6">
    <div class="bg-gradient-to-r from-[#11192e] via-[#151f38] to-[#11192e] border border-indigo-900/60 rounded-2xl p-4 sm:p-5 shadow-xl relative overflow-hidden">
      <div class="flex items-center gap-2 text-indigo-300 text-sm font-semibold mb-2">
        <i class="fa-solid fa-microchip text-indigo-400 text-base"></i>
        <span>Master Gemini Engine — Cross-Feed Intelligence</span>
      </div>
      <p class="text-xs text-slate-400 mb-3">Query across all loaded intelligence briefings simultaneously using your chosen engine:</p>
      
      <!-- Master Preload Buttons -->
      <div class="flex flex-wrap gap-2 mb-3">
        <button onclick="runMasterQuery('Provide a master layman synthesis of all major developments across the dashboard today.')" 
          class="pill-btn px-3 py-1.5 rounded-lg bg-indigo-950/80 hover:bg-indigo-900 border border-indigo-800 text-xs text-indigo-200 flex items-center gap-1.5">
          <i class="fa-solid fa-user-group text-amber-400"></i> Dashboard Layman Digest
        </button>
        <button onclick="runMasterQuery('Extract the top 5 high-yield UPSC exam points (Prelims facts + Mains GS2/GS3) across all current videos.')" 
          class="pill-btn px-3 py-1.5 rounded-lg bg-indigo-950/80 hover:bg-indigo-900 border border-indigo-800 text-xs text-indigo-200 flex items-center gap-1.5">
          <i class="fa-solid fa-graduation-cap text-indigo-400"></i> Top 5 UPSC Pointers Across All Feeds
        </button>
        <button onclick="runMasterQuery('Identify the single most critical geopolitical strategic conflict across these updates and simplify its core implications.')" 
          class="pill-btn px-3 py-1.5 rounded-lg bg-indigo-950/80 hover:bg-indigo-900 border border-indigo-800 text-xs text-indigo-200 flex items-center gap-1.5">
          <i class="fa-solid fa-compass text-emerald-400"></i> Major Strategic Conflict Breakdown
        </button>
      </div>

      <!-- Master Query Input -->
      <div class="flex items-center gap-2">
        <div class="relative flex-1">
          <input id="masterInput" type="text" placeholder="Ask Master Gemini across all channels (e.g. 'Compare relations with Iran across reports')..." 
            onkeydown="if(event.key==='Enter') submitMasterQuery()"
            class="w-full bg-[#0d1424] text-xs text-slate-200 placeholder-slate-500 rounded-xl pl-3.5 pr-9 py-2.5 border border-slate-700 focus:outline-none focus:border-indigo-500 shadow-inner" />
          <button onclick="submitMasterQuery()" class="absolute right-3 top-2.5 text-slate-400 hover:text-indigo-400">
            <i class="fa-solid fa-paper-plane text-xs"></i>
          </button>
        </div>
      </div>

      <!-- Master Output -->
      <div id="masterOutput" class="hidden mt-4 p-4 rounded-xl bg-[#0d1424]/95 border border-indigo-800/60 text-xs text-slate-200 space-y-2 shadow-inner">
      </div>
    </div>
  </section>

  <!-- Main Content & Per-Video Engine -->
  <main class="max-w-7xl mx-auto px-4 sm:px-8 pt-6">
    <!-- Channel Filter Tabs -->
    <div id="filterBar" class="flex items-center gap-2 overflow-x-auto pb-4 no-scrollbar">
      <button onclick="filterByChannel('ALL')" class="channel-pill active px-3.5 py-1.5 rounded-lg text-xs font-medium bg-indigo-600 text-white whitespace-nowrap">All Channels</button>
    </div>

    <!-- Video Grid -->
    <div id="videoGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-6 mt-2">
      <div class="col-span-full py-16 text-center text-slate-500">
        <i class="fa-solid fa-circle-notch fa-spin text-2xl text-indigo-400 mb-2"></i>
        <p class="text-sm">Loading intelligence updates...</p>
      </div>
    </div>
  </main>

  <script>
    let allVideos = [];
    let currentFilter = 'ALL';

    function getApiKey() {
      return localStorage.getItem('GEMINI_FRONTEND_KEY') || '';
    }

    function promptApiKey() {
      const existing = getApiKey();
      const entered = prompt("Enter your Gemini API Key to activate all intelligence engines:", existing);
      if (entered !== null) {
        localStorage.setItem('GEMINI_FRONTEND_KEY', entered.trim());
        updateKeyStatus();
      }
    }

    function updateKeyStatus() {
      const label = document.getElementById('keyStatusLabel');
      if (getApiKey()) {
        label.innerText = "Gemini Key Active";
        label.classList.add("text-emerald-400");
      } else {
        label.innerText = "Set Gemini Key";
        label.classList.remove("text-emerald-400");
      }
    }

    function saveEnginePreference() {
      const val = document.getElementById('engineSelector').value;
      localStorage.setItem('GEMINI_SELECTED_ENGINE', val);
    }

    function saveThinkingPreference() {
      const val = document.getElementById('thinkingLevel').value;
      localStorage.setItem('GEMINI_THINKING_LEVEL', val);
    }

    function restorePreferences() {
      const savedEngine = localStorage.getItem('GEMINI_SELECTED_ENGINE');
      if (savedEngine) document.getElementById('engineSelector').value = savedEngine;
      const savedThinking = localStorage.getItem('GEMINI_THINKING_LEVEL');
      if (savedThinking) document.getElementById('thinkingLevel').value = savedThinking;
    }

    async function loadFeed() {
      updateKeyStatus();
      restorePreferences();
      try {
        const res = await fetch(`videos.json?t=${new Date().getTime()}`);
        if (!res.ok) throw new Error("Could not load videos.json");
        allVideos = await res.json();
        document.getElementById('countBadge').innerText = `${allVideos.length} Updates`;
        renderFilters();
        renderGrid();
      } catch (err) {
        document.getElementById('videoGrid').innerHTML = `
          <div class="col-span-full text-center py-12 text-slate-400">
            <i class="fa-solid fa-triangle-exclamation text-amber-500 text-3xl mb-3"></i>
            <p class="font-medium">Failed to load feed data.</p>
            <p class="text-xs text-slate-500 mt-1">Ensure the workflow has fetched data into videos.json.</p>
          </div>`;
      }
    }

    function renderFilters() {
      const channels = ['ALL', ...new Set(allVideos.map(v => v.channel_title))];
      const bar = document.getElementById('filterBar');
      bar.innerHTML = channels.map(ch => `
        <button onclick="filterByChannel('${ch}')" 
          class="channel-pill px-3.5 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition ${currentFilter === ch ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-slate-400 hover:bg-slate-800 border border-slate-800'}">
          ${ch === 'ALL' ? 'All Channels' : ch}
        </button>
      `).join('');
    }

    function filterByChannel(channel) {
      currentFilter = channel;
      renderFilters();
      renderGrid();
    }

    // MULTI-ENGINE CALL FUNCTION WITH CASCADE FALLBACK
    async function callGeminiWithAutoFallback(promptText, statusCallback) {
      const key = getApiKey();
      if (!key) throw new Error("GEMINI_KEY_REQUIRED");

      const chosenEngine = document.getElementById('engineSelector').value;
      const thinkingMode = document.getElementById('thinkingLevel').value;

      // Thinking level mapped to token thinking budget
      let thinkingConfig = {};
      if (thinkingMode === 'low') {
        thinkingConfig = { thinkingConfig: { thinkingBudget: 1024 } };
      } else if (thinkingMode === 'medium') {
        thinkingConfig = { thinkingConfig: { thinkingBudget: 4096 } };
      } else if (thinkingMode === 'high') {
        thinkingConfig = { thinkingConfig: { thinkingBudget: 8192 } };
      }

      // Priority list: user-selected engine first, then the remaining 3.8/3.5/3.1/4 engines, followed by fallback models
      let candidatePool = [
        chosenEngine,
        "gemini-3.8-flash",
        "gemini-3.5-flash-lite",
        "gemini-3.1-pro",
        "gemini-4-argon",
        "gemini-1.5-flash",
        "gemini-1.5-flash-8b",
        "gemini-flash-latest"
      ];
      candidatePool = [...new Set(candidatePool)];

      for (let i = 0; i < candidatePool.length; i++) {
        const modelName = candidatePool[i];
        try {
          if (statusCallback && i > 0) {
            statusCallback(`Engine busy; routing to next best (${modelName})...`);
          }

          const requestBody = {
            contents: [{ parts: [{ text: promptText }] }],
            generationConfig: thinkingConfig
          };

          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${key}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(requestBody)
          });

          const data = await res.json();

          if (data.error) {
            const errorMsg = data.error.message || "";
            // Intercept and auto-add any model suggestion from Google's API response
            const match = errorMsg.match(/models\/([a-zA-Z0-9\.\-_]+)/);
            if (match && match[1] && !candidatePool.includes(match[1])) {
              candidatePool.splice(i + 1, 0, match[1]);
            }
            continue; // Silently fallback
          }

          const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (reply && reply.trim().length > 0) {
            return reply;
          }
        } catch (netErr) {
          continue; // Network or format error; try next candidate
        }
      }

      throw new Error("All AI engines are temporarily over capacity. Please retry in 10 seconds.");
    }

    function formatMarkdown(text) {
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong class="text-white">$1</strong>')
        .replace(/^\*\s(.*)$/gm, '<li class="ml-4 list-disc text-slate-300">$1</li>')
        .replace(/\n\n/g, '<p class="mt-2"></p>')
        .replace(/\n/g, '<br/>');
    }

    // MASTER ENGINE HANDLERS
    function submitMasterQuery() {
      const input = document.getElementById('masterInput');
      const q = input.value.trim();
      if (q) runMasterQuery(q);
    }

    async function runMasterQuery(query) {
      const box = document.getElementById('masterOutput');
      box.classList.remove('hidden');
      box.innerHTML = `
        <div class="flex items-center gap-2 text-indigo-400">
          <i class="fa-solid fa-circle-notch fa-spin"></i>
          <span id="masterStatusText">Master Gemini synthesizing across briefings...</span>
        </div>`;

      const contextSummary = allVideos.slice(0, 12).map((v, i) => 
        `[${i+1}] Channel: ${v.channel_title} | Title: ${v.title} | Snippet: ${v.description.slice(0, 250)}`
      ).join('\n');

      const masterPrompt = `
You are the Master Geopolitical & Current Affairs AI Engine.
Context from active dashboard video reports:
${contextSummary}

User Request: "${query}"

Provide an authoritative, well-structured intelligence report. Use bold headings and concise bullet points. No conversational filler.
      `;

      try {
        const text = await callGeminiWithAutoFallback(masterPrompt, (msg) => {
          const el = document.getElementById('masterStatusText');
          if (el) el.innerText = msg;
        });

        box.innerHTML = `
          <div class="flex items-center justify-between pb-2 border-b border-indigo-800/60 mb-2">
            <span class="font-semibold text-indigo-300 flex items-center gap-1.5">
              <i class="fa-solid fa-brain text-amber-400"></i> ${query}
            </span>
            <button onclick="document.getElementById('masterOutput').classList.add('hidden')" class="text-slate-400 hover:text-white">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <div class="prose-slate text-xs space-y-1.5 leading-relaxed">${formatMarkdown(text)}</div>
        `;
      } catch (err) {
        if (err.message === "GEMINI_KEY_REQUIRED") {
          promptApiKey();
          box.classList.add('hidden');
        } else {
          box.innerHTML = `<div class="text-rose-400 text-xs"><i class="fa-solid fa-triangle-exclamation"></i> Analysis note: ${err.message}</div>`;
        }
      }
    }

    // PER-VIDEO RENDER & HANDLERS
    function renderGrid() {
      const filtered = currentFilter === 'ALL' ? allVideos : allVideos.filter(v => v.channel_title === currentFilter);
      const grid = document.getElementById('videoGrid');

      if (!filtered.length) {
        grid.innerHTML = `<div class="col-span-full text-center text-slate-500 py-12 text-sm">No updates found for this channel.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <div class="card-glow bg-[#131b2e] rounded-xl overflow-hidden flex flex-col justify-between shadow-lg">
          <div>
            <div class="relative aspect-video w-full bg-slate-950 overflow-hidden">
              <img src="${item.thumbnail_url}" alt="${item.title}" class="w-full h-full object-cover" loading="lazy" />
              <div class="absolute top-2 left-2 px-2 py-0.5 rounded text-[11px] font-semibold bg-black/75 backdrop-blur-md text-slate-200 border border-white/10">
                ${item.channel_title}
              </div>
            </div>

            <div class="p-4">
              <h2 class="text-sm font-semibold text-slate-100 line-clamp-2 leading-snug hover:text-indigo-400 transition">
                <a href="https://www.youtube.com/watch?v=${item.id}" target="_blank" rel="noopener noreferrer">${item.title}</a>
              </h2>
              <p class="text-xs text-slate-400 line-clamp-2 mt-1.5 leading-relaxed">${item.description || 'No description provided.'}</p>
            </div>
          </div>

          <!-- Video Gemini Engine -->
          <div class="border-t border-slate-800/80 bg-[#0d1424] p-3.5 rounded-b-xl">
            <div class="flex items-center justify-between text-xs font-medium mb-2.5">
              <span class="text-indigo-400 flex items-center gap-1.5">
                <i class="fa-solid fa-sparkles text-amber-400"></i> Video AI Engine
              </span>
              <!-- Own Thinking Engine Trigger -->
              <button onclick="generateVideoQuestions('${item.id}')" 
                class="pill-btn text-[11px] px-2.5 py-1 rounded-md bg-purple-950/80 hover:bg-purple-900 border border-purple-800/80 text-purple-200 flex items-center gap-1">
                <i class="fa-solid fa-wand-magic-sparkles text-purple-400"></i> AI Smart Questions
              </button>
            </div>

            <!-- Preloaded Questions (The 3 Core Frameworks) -->
            <div class="flex flex-wrap gap-1.5 mb-2">
              <button onclick="askVideoGemini('${item.id}', 'Layman\'s Extract: Explain this entire event in simple everyday language with zero jargon, as if explaining to a beginner.')" 
                class="pill-btn px-2.5 py-1 rounded bg-slate-800/90 hover:bg-slate-700 text-[11px] text-slate-200 border border-slate-700/80 flex items-center gap-1">
                <i class="fa-solid fa-comment-dots text-teal-400 text-[10px]"></i> Layman's Extract
              </button>

              <button onclick="askVideoGemini('${item.id}', 'Specific Knowledge Simplified: Break down the exact institutional mechanisms, strategic treaties, legal/economic facts, and data points in a crystal-clear simplified format.')" 
                class="pill-btn px-2.5 py-1 rounded bg-slate-800/90 hover:bg-slate-700 text-[11px] text-slate-200 border border-slate-700/80 flex items-center gap-1">
                <i class="fa-solid fa-layer-group text-sky-400 text-[10px]"></i> Specific Knowledge Simplified
              </button>

              <button onclick="askVideoGemini('${item.id}', 'UPSC Curated Analysis: Provide Prelims high-yield factual points, Mains GS-II/GS-III syllabus mapping, constitutional/international relations dimensions, and a 2-point conclusion.')" 
                class="pill-btn px-2.5 py-1 rounded bg-slate-800/90 hover:bg-slate-700 text-[11px] text-amber-200 border border-amber-900/60 bg-amber-950/30 flex items-center gap-1">
                <i class="fa-solid fa-landmark text-amber-400 text-[10px]"></i> UPSC Curated
              </button>
            </div>

            <!-- Dynamic AI-Generated Questions Container -->
            <div id="aiQuestions-${item.id}" class="hidden flex flex-wrap gap-1.5 mb-2.5 p-2 rounded-lg bg-[#141d33] border border-purple-900/50">
            </div>

            <!-- Custom Question Input Bar -->
            <div class="flex items-center gap-1.5">
              <div class="relative flex-1">
                <input id="input-${item.id}" type="text" placeholder="Ask specific questions on this video..." 
                  onkeydown="if(event.key==='Enter') submitCardPrompt('${item.id}')"
                  class="w-full bg-[#162035] text-xs text-slate-200 placeholder-slate-500 rounded-lg pl-3 pr-8 py-2 border border-slate-700/70 focus:outline-none focus:border-indigo-500" />
                <button onclick="submitCardPrompt('${item.id}')" class="absolute right-2 top-2 text-slate-400 hover:text-indigo-400">
                  <i class="fa-solid fa-arrow-turn-down fa-rotate-90 text-xs"></i>
                </button>
              </div>
              <a href="https://www.youtube.com/watch?v=${item.id}" target="_blank" rel="noopener noreferrer" 
                class="px-3 py-2 rounded-lg bg-red-600/90 hover:bg-red-600 text-white text-xs font-medium flex items-center gap-1 shrink-0 transition">
                <i class="fa-brands fa-youtube"></i> Watch
              </a>
            </div>

            <!-- Response Output Box -->
            <div id="output-${item.id}" class="hidden mt-3 p-3.5 rounded-lg bg-[#162035] border border-indigo-900/50 text-xs text-slate-300 leading-relaxed space-y-1.5">
            </div>
          </div>
        </div>
      `).join('');
    }

    function submitCardPrompt(id) {
      const input = document.getElementById(`input-${id}`);
      const val = input.value.trim();
      if (val) askVideoGemini(id, val);
    }

    // Dynamic Self-Thinking Questions Generator
    async function generateVideoQuestions(videoId) {
      const video = allVideos.find(v => v.id === videoId);
      if (!video) return;

      const container = document.getElementById(`aiQuestions-${videoId}`);
      container.classList.remove('hidden');
      container.innerHTML = `<span class="text-[11px] text-purple-300 flex items-center gap-1"><i class="fa-solid fa-circle-notch fa-spin text-purple-400"></i> Formulating smart inquiries...</span>`;

      const prompt = `
Based on this video briefing:
Title: "${video.title}"
Context: "${video.description.slice(0, 1500)}"

Formulate 3 concise, high-value, probing analytical questions uniquely suited for this specific briefing. 
Return ONLY valid JSON array with 3 short strings. Example: ["Question 1?", "Question 2?", "Question 3?"]
`;

      try {
        const raw = await callGeminiWithAutoFallback(prompt);
        const match = raw.match(/\[.*\]/s);
        const questions = JSON.parse(match ? match[0] : raw);

        container.innerHTML = `
          <div class="w-full text-[10px] uppercase font-semibold tracking-wider text-purple-400 mb-1 flex items-center gap-1">
            <i class="fa-solid fa-wand-magic-sparkles"></i> AI Suggested Inquiries:
          </div>
          ${questions.map(q => `
            <button onclick="askVideoGemini('${videoId}', '${q.replace(/'/g, "\\'")}')" 
              class="pill-btn text-left px-2 py-1 rounded bg-purple-950/60 hover:bg-purple-900 border border-purple-800 text-[11px] text-purple-200">
              ⚡ ${q}
            </button>
          `).join('')}
        `;
      } catch (e) {
        container.innerHTML = `<span class="text-[11px] text-rose-400">Could not generate questions. Tap to retry.</span>`;
      }
    }

    // Video-Specific Analysis Runner
    async function askVideoGemini(videoId, question) {
      const video = allVideos.find(v => v.id === videoId);
      if (!video) return;

      const box = document.getElementById(`output-${videoId}`);
      box.classList.remove('hidden');
      box.innerHTML = `
        <div class="flex items-center gap-2 text-indigo-400">
          <i class="fa-solid fa-circle-notch fa-spin"></i>
          <span id="cardStatusText-${videoId}">Gemini analyzing: "<em>${question.slice(0, 45)}...</em>"...</span>
        </div>`;

      const prompt = `
You are a senior intelligence analyst and competitive exam mentor.
Video Title: "${video.title}"
Channel: "${video.channel_title}"
Video Context: ${video.description.slice(0, 2000)}

Specific User Inquiry:
"${question}"

Provide a crisp, clear, high-yield briefing tailored precisely to this instruction. Use bold headers and clean bullet points.
`;

      try {
        const text = await callGeminiWithAutoFallback(prompt, (msg) => {
          const el = document.getElementById(`cardStatusText-${videoId}`);
          if (el) el.innerText = msg;
        });

        box.innerHTML = `
          <div class="flex items-center justify-between pb-1.5 border-b border-slate-700/60 mb-2">
            <span class="text-[11px] font-semibold text-indigo-300 flex items-center gap-1">
              <i class="fa-solid fa-sparkles text-amber-400"></i> ${question.slice(0, 50)}...
            </span>
            <button onclick="document.getElementById('output-${videoId}').classList.add('hidden')" class="text-slate-500 hover:text-slate-300 text-xs">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <div class="prose-slate text-xs space-y-1">${formatMarkdown(text)}</div>
        `;
      } catch (err) {
        if (err.message === "GEMINI_KEY_REQUIRED") {
          promptApiKey();
          box.classList.add('hidden');
        } else {
          box.innerHTML = `
            <div class="text-rose-400 text-xs flex items-start gap-1.5">
              <i class="fa-solid fa-triangle-exclamation mt-0.5"></i>
              <div>
                <p class="font-medium">${err.message}</p>
                <p class="text-[11px] text-slate-400 mt-0.5">Please check back in a few seconds.</p>
              </div>
            </div>`;
        }
      }
    }

    loadFeed();
  </script>
</body>
</html>
