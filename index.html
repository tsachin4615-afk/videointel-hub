<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoIntel Hub | Current Affairs Intelligence</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .card-glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="sticky top-0 z-50 card-glass border-b border-slate-700 px-4 py-3">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-brain text-indigo-400 text-2xl"></i>
        <div>
          <h1 class="text-lg font-bold leading-none tracking-tight">VideoIntel Hub</h1>
          <p class="text-xs text-slate-400">Automated Intelligence & Current Affairs</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <span id="video-count" class="text-xs bg-indigo-900/60 text-indigo-300 border border-indigo-500/30 px-2.5 py-1 rounded-full font-mono">Loading...</span>
      </div>
    </div>
  </header>

  <!-- Filter & Search Bar -->
  <div class="max-w-6xl mx-auto w-full px-4 pt-4 pb-2">
    <div class="relative">
      <i class="fa-solid fa-search absolute left-3 top-3 text-slate-400 text-sm"></i>
      <input type="text" id="search-input" placeholder="Search topics, entities, analysis..." 
        class="w-full bg-slate-800/80 border border-slate-700 rounded-lg pl-9 pr-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
    </div>
  </div>

  <!-- Main Feed -->
  <main class="max-w-6xl mx-auto w-full px-4 py-4 flex-1">
    <div id="articles-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <div class="col-span-full text-center py-12 text-slate-400 text-sm">Loading intelligence reports...</div>
    </div>
  </main>

  <!-- Dossier Modal -->
  <div id="dossier-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-3">
    <div class="bg-slate-900 border border-slate-700 rounded-xl w-full max-w-3xl max-h-[90vh] flex flex-col shadow-2xl">
      <div class="flex items-center justify-between p-4 border-b border-slate-800">
        <h3 id="modal-title" class="font-bold text-base text-slate-100 truncate pr-4"></h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="modal-body" class="p-5 overflow-y-auto space-y-4 text-sm text-slate-300 leading-relaxed prose prose-invert max-w-none">
      </div>
    </div>
  </div>

  <script>
    let allArticles = [];

    async function loadData() {
      try {
        const res = await fetch('videos.json?t=' + Date.now());
        const data = await res.json();
        allArticles = Array.isArray(data) ? data : (data.videos || []);
        document.getElementById('video-count').textContent = `${allArticles.length} Dossiers`;
        renderFeed(allArticles);
      } catch (err) {
        document.getElementById('articles-container').innerHTML = 
          `<div class="col-span-full p-6 text-center text-rose-400">Failed to load data feed. Ensure workflow has committed videos.json.</div>`;
      }
    }

    function renderFeed(items) {
      const container = document.getElementById('articles-container');
      if (!items || items.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">No intelligence dossiers found.</div>`;
        return;
      }

      container.innerHTML = items.map((item, idx) => {
        const title = item.title || "Untitled Video";
        const channel = item.channel_title || item.channel || "Source Channel";
        const thumb = item.thumbnail_url || item.thumbnail || `https://i.ytimg.com/vi/${item.id}/hqdefault.jpg`;
        const summary = item.executive_summary || item.summary || item.description || "Analysis pending...";
        const takeaways = (item.key_takeaways || []).slice(0, 2);

        return `
          <div class="card-glass rounded-xl overflow-hidden flex flex-col border border-slate-800 hover:border-indigo-500/50 transition">
            <div class="relative">
              <img src="${thumb}" alt="${title}" class="w-full h-44 object-cover" onerror="this.src='https://via.placeholder.com/640x360?text=No+Preview'">
              <span class="absolute bottom-2 left-2 bg-black/70 text-indigo-300 text-[11px] px-2 py-0.5 rounded font-medium">${channel}</span>
            </div>
            <div class="p-4 flex flex-col flex-1">
              <h2 class="font-semibold text-sm line-clamp-2 text-slate-100 mb-2">${title}</h2>
              <p class="text-xs text-slate-400 line-clamp-3 mb-3 leading-relaxed">${summary}</p>
              
              ${takeaways.length ? `
                <div class="bg-slate-900/70 p-2.5 rounded-lg border border-slate-800/80 mb-3 text-[11px] text-slate-300 space-y-1">
                  <span class="font-bold text-indigo-400 block text-[10px] uppercase tracking-wider">Key Takeaways</span>
                  ${takeaways.map(t => `<p class="truncate">• ${t}</p>`).join('')}
                </div>
              ` : ''}

              <div class="mt-auto pt-3 border-t border-slate-800/80 flex items-center justify-between">
                <a href="https://www.youtube.com/watch?v=${item.id}" target="_blank" class="text-xs text-rose-400 hover:underline flex items-center gap-1">
                  <i class="fa-brands fa-youtube"></i> Watch
                </a>
                <button onclick="openModal(${idx})" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-md font-medium transition">
                  Deep Dossier
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openModal(idx) {
      const item = allArticles[idx];
      document.getElementById('modal-title').textContent = item.title;
      const content = item.deep_dossier_markdown || item.markdown || item.executive_summary || "Full dossier content pending analysis.";
      document.getElementById('modal-body').innerHTML = marked.parse(content);
      document.getElementById('dossier-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('dossier-modal').classList.add('hidden');
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = allArticles.filter(a => 
        (a.title && a.title.toLowerCase().includes(q)) ||
        (a.executive_summary && a.executive_summary.toLowerCase().includes(q)) ||
        (a.channel_title && a.channel_title.toLowerCase().includes(q))
      );
      renderFeed(filtered);
    });

    loadData();
  </script>
</body>
</html>
