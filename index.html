<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoIntel Hub | Instant Reader Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b0f19; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .card-glow { transition: all 0.2s ease; border: 1px solid #1e293b; }
    .card-glow:hover { border-color: #38bdf8; transform: translateY(-2px); }
    .pill-btn { transition: all 0.15s ease; }
    .pill-btn:active { transform: scale(0.96); }
    select { appearance: none; -webkit-appearance: none; }
    .unread-indicator { width: 8px; height: 8px; border-radius: 9999px; background-color: #38bdf8; box-shadow: 0 0 8px #38bdf8; }
  </style>
</head>
<body class="min-h-screen pb-20">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-[#0f172a]/95 backdrop-blur-md border-b border-slate-800 px-4 py-3 sm:px-8">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="h-9 w-9 rounded-lg bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
          <i class="fa-solid fa-bolt text-lg"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-white tracking-tight flex items-center gap-2">
            VideoIntel Hub
            <span class="text-xs font-semibold px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-800">Server Auto-Prepared</span>
          </h1>
          <p class="text-xs text-slate-400">Zero Wait • Tap Any Heading or Thumbnail to Read</p>
        </div>
      </div>

      <!-- Controls & Quick Navigation Link -->
      <div class="flex flex-wrap items-center gap-2">
        <a href="headings.html" class="text-xs bg-indigo-900/80 hover:bg-indigo-800 text-indigo-200 border border-indigo-700/80 px-3 py-1.5 rounded-lg flex items-center gap-1.5 font-medium transition shadow-sm">
          <i class="fa-solid fa-list-ul text-sky-400"></i> Headings Quick View
        </a>

        <!-- Engine Selector for On-Demand Queries -->
        <div class="relative">
          <select id="engineSelector" onchange="saveEnginePreference()" class="text-xs bg-slate-900 border border-slate-700 text-indigo-300 pl-3 pr-7 py-1.5 rounded-lg focus:outline-none focus:border-indigo-500">
            <option value="gemini-3.8-flash" selected>3.8 Flash (Deep)</option>
            <option value="gemini-3.5-flash-lite">3.5 Flash-Lite (Fast)</option>
            <option value="gemini-3.1-pro">3.1 Pro (Research)</option>
            <option value="gemini-4-argon">4 Argon (Analysis)</option>
          </select>
          <i class="fa-solid fa-chevron-down absolute right-2.5 top-2.5 text-[10px] text-slate-500 pointer-events-none"></i>
        </div>

        <button onclick="promptApiKey()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-1.5 transition">
          <i class="fa-solid fa-key text-amber-400"></i>
          <span id="keyStatusLabel">Set Gemini Key</span>
        </button>

        <span id="countBadge" class="text-xs bg-indigo-950 text-indigo-300 border border-indigo-800 px-2.5 py-1 rounded-full font-medium">Loading...</span>
      </div>
    </div>
  </header>

  <!-- Master AI Engine (Global Synthesis) -->
  <section class="max-w-7xl mx-auto px-4 sm:px-8 pt-5">
    <div class="bg-gradient-to-r from-[#11192e] via-[#151f38] to-[#11192e] border border-indigo-900/60 rounded-2xl p-4 sm:p-5 shadow-xl relative overflow-hidden">
      <div class="flex items-center gap-2 text-indigo-300 text-sm font-semibold mb-2">
        <i class="fa-solid fa-microchip text-indigo-400 text-base"></i>
        <span>Master Gemini Engine — Cross-Feed Intelligence</span>
      </div>
      <p class="text-xs text-slate-400 mb-3">Synthesizes across all active intelligence briefings:</p>
      
      <div class="flex flex-wrap gap-2 mb-3">
        <button onclick="runMasterQuery('Provide a master layman synthesis of all major developments across the dashboard today in simple readable news format.')" 
          class="pill-btn px-3 py-1.5 rounded-lg bg-indigo-950/80 hover:bg-indigo-900 border border-indigo-800 text-xs text-indigo-200 flex items-center gap-1.5">
          <i class="fa-solid fa-user-group text-amber-400"></i> Dashboard Layman Digest
        </button>
        <button onclick="runMasterQuery('Extract the top 5 high-yield UPSC exam points (Prelims facts + Mains GS2/GS3) across all current videos.')" 
          class="pill-btn px-3 py-1.5 rounded-lg bg-indigo-950/80 hover:bg-indigo-900 border border-indigo-800 text-xs text-indigo-200 flex items-center gap-1.5">
          <i class="fa-solid fa-graduation-cap text-indigo-400"></i> Top 5 UPSC Pointers Across All Feeds
        </button>
        <button onclick="runMasterQuery('Identify the single most critical geopolitical strategic conflict across these updates and simplify its core implications.')" 
          class="pill-btn px-3 py-1.5 rounded-lg bg-indigo-950/80 hover:bg-indigo-900 border border-indigo-800 text-xs text-indigo-200 flex items-center gap-1.5">
          <i class="fa-solid fa-compass text-emerald-400"></i> Major Strategic Conflict Breakdown
        </button>
      </div>

      <div class="flex items-center gap-2">
        <div class="relative flex-1">
          <input id="masterInput" type="text" placeholder="Ask Master Gemini across all channels (e.g. 'Compare relations with Iran across reports')..." 
            onkeydown="if(event.key==='Enter') submitMasterQuery()"
            class="w-full bg-[#0d1424] text-xs text-slate-200 placeholder-slate-500 rounded-xl pl-3.5 pr-9 py-2.5 border border-slate-700 focus:outline-none focus:border-indigo-500 shadow-inner" />
          <button onclick="submitMasterQuery()" class="absolute right-3 top-2.5 text-slate-400 hover:text-indigo-400">
            <i class="fa-solid fa-paper-plane text-xs"></i>
          </button>
        </div>
      </div>

      <div id="masterOutput" class="hidden mt-4 p-4 rounded-xl bg-[#0d1424]/95 border border-indigo-800/60 text-xs text-slate-200 space-y-2 shadow-inner">
      </div>
    </div>
  </section>

  <!-- Filter & Controls Toolbar -->
  <main class="max-w-7xl mx-auto px-4 sm:px-8 pt-5">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
      <div class="flex items-center gap-2">
        <button id="timeFilterBtn" onclick="toggleTimeFilter()" class="pill-btn px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-700 bg-slate-900 text-slate-300 hover:border-sky-500 transition flex items-center gap-1.5">
          <i class="fa-regular fa-clock text-sky-400"></i> <span id="timeFilterLabel">Showing All Time (Date & Time Ordered)</span>
        </button>
        <button onclick="markAllAsRead()" class="pill-btn px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-800 bg-slate-900/60 text-slate-400 hover:text-slate-200 transition">
          <i class="fa-solid fa-check-double"></i> Mark All as Read
        </button>
      </div>

      <div class="text-xs text-slate-400" id="readStats">
        0 Read / 0 Total
      </div>
    </div>

    <!-- Channel Filters -->
    <div id="filterBar" class="flex items-center gap-2 overflow-x-auto pb-4 no-scrollbar">
      <button onclick="filterByChannel('ALL')" class="channel-pill active px-3.5 py-1.5 rounded-lg text-xs font-medium bg-indigo-600 text-white whitespace-nowrap">All Channels</button>
    </div>

    <!-- Video Grid -->
    <div id="videoGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-6 mt-2">
      <div class="col-span-full py-16 text-center text-slate-500">
        <i class="fa-solid fa-circle-notch fa-spin text-2xl text-indigo-400 mb-2"></i>
        <p class="text-sm">Loading intelligence updates...</p>
      </div>
    </div>
  </main>

  <script>
    let allVideos = [];
    let currentFilter = 'ALL';
    let onlyLast24Hours = false;

    function getReadSet() {
      try {
        return new Set(JSON.parse(localStorage.getItem('VIDEO_INTEL_READ_SET') || '[]'));
      } catch (e) {
        return new Set();
      }
    }

    function markAsRead(videoId) {
      const readSet = getReadSet();
      if (!readSet.has(videoId)) {
        readSet.add(videoId);
        localStorage.setItem('VIDEO_INTEL_READ_SET', JSON.stringify(Array.from(readSet)));
        updateCardReadUI(videoId);
        updateReadStatsDisplay();
      }
    }

    function toggleRead(videoId) {
      const readSet = getReadSet();
      if (readSet.has(videoId)) readSet.delete(videoId);
      else readSet.add(videoId);
      localStorage.setItem('VIDEO_INTEL_READ_SET', JSON.stringify(Array.from(readSet)));
      renderGrid();
    }

    function markAllAsRead() {
      const readSet = new Set(allVideos.map(v => v.id));
      localStorage.setItem('VIDEO_INTEL_READ_SET', JSON.stringify(Array.from(readSet)));
      renderGrid();
    }

    function updateCardReadUI(videoId) {
      const dot = document.getElementById(`readDot-${videoId}`);
      const btn = document.getElementById(`readBtn-${videoId}`);
      const card = document.getElementById(`card-${videoId}`);
      if (dot) dot.classList.add('hidden');
      if (btn) {
        btn.innerHTML = `<i class="fa-solid fa-check text-emerald-400"></i> Read`;
        btn.classList.add('text-emerald-400');
      }
      if (card) card.classList.add('opacity-85');
    }

    function updateReadStatsDisplay() {
      const readSet = getReadSet();
      const totalRead = allVideos.filter(v => readSet.has(v.id)).length;
      document.getElementById('readStats').innerText = `${totalRead} Read / ${allVideos.length} Total`;
    }

    function toggleTimeFilter() {
      onlyLast24Hours = !onlyLast24Hours;
      document.getElementById('timeFilterLabel').innerText = onlyLast24Hours ? "Last 24 Hours Only" : "Showing All Time (Date & Time Ordered)";
      document.getElementById('timeFilterBtn').classList.toggle('border-sky-500', onlyLast24Hours);
      document.getElementById('timeFilterBtn').classList.toggle('bg-sky-950/40', onlyLast24Hours);
      renderGrid();
    }

    function getApiKey() {
      return localStorage.getItem('GEMINI_FRONTEND_KEY') || '';
    }

    function promptApiKey() {
      const existing = getApiKey();
      const entered = prompt("Enter your Gemini API Key for deeper on-demand queries:", existing);
      if (entered !== null) {
        localStorage.setItem('GEMINI_FRONTEND_KEY', entered.trim());
        updateKeyStatus();
      }
    }

    function updateKeyStatus() {
      const label = document.getElementById('keyStatusLabel');
      if (getApiKey()) {
        label.innerText = "Gemini Key Active";
        label.classList.add("text-emerald-400");
      } else {
        label.innerText = "Set Gemini Key";
        label.classList.remove("text-emerald-400");
      }
    }

    function saveEnginePreference() {
      localStorage.setItem('GEMINI_SELECTED_ENGINE', document.getElementById('engineSelector').value);
    }

    function restorePreferences() {
      const savedEngine = localStorage.getItem('GEMINI_SELECTED_ENGINE');
      if (savedEngine) document.getElementById('engineSelector').value = savedEngine;
    }

    async function loadFeed() {
      updateKeyStatus();
      restorePreferences();
      try {
        const res = await fetch(`videos.json?t=${new Date().getTime()}`);
        if (!res.ok) throw new Error("Could not load feed");
        const rawVideos = await res.json();

        // STRICT CHRONOLOGICAL ORDERING (Newest First)
        allVideos = rawVideos.sort((a, b) => new Date(b.published_at) - new Date(a.published_at));

        document.getElementById('countBadge').innerText = `${allVideos.length} Updates`;
        renderFilters();
        renderGrid();
      } catch (err) {
        document.getElementById('videoGrid').innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-sm">Failed to load feed data. Please check back shortly.</div>`;
      }
    }

    function renderFilters() {
      const channels = ['ALL', ...new Set(allVideos.map(v => v.channel_title))];
      const bar = document.getElementById('filterBar');
      bar.innerHTML = channels.map(ch => `
        <button onclick="filterByChannel('${ch.replace(/'/g, "\\'")}')" 
          class="channel-pill px-3.5 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition ${currentFilter === ch ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-slate-400 hover:bg-slate-800 border border-slate-800'}">
          ${ch === 'ALL' ? 'All Channels' : ch}
        </button>
      `).join('');
    }

    function filterByChannel(channel) {
      currentFilter = channel;
      renderFilters();
      renderGrid();
    }

    // ON-DEMAND GEMINI CLIENT (Fallback & Deepen)
    async function callGemini(promptText) {
      const key = getApiKey();
      if (!key) throw new Error("GEMINI_KEY_REQUIRED");

      const chosen = document.getElementById('engineSelector').value;
      const pool = [...new Set([chosen, "gemini-3.8-flash", "gemini-3.5-flash-lite", "gemini-3.1-pro", "gemini-4-argon", "gemini-1.5-flash"])];

      for (const model of pool) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
          });
          const data = await res.json();
          if (data.candidates?.[0]?.content?.parts?.[0]?.text) {
            return data.candidates[0].content.parts[0].text;
          }
        } catch (e) {
          continue;
        }
      }
      throw new Error("Engines busy. Tap to retry.");
    }

    function formatMarkdown(text) {
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong class="text-white">$1</strong>')
        .replace(/^###\s(.*)$/gm, '<h3 class="text-indigo-300 font-semibold text-xs mt-2 mb-1">$1</h3>')
        .replace(/^##\s(.*)$/gm, '<h2 class="text-amber-300 font-bold text-xs mt-2.5 mb-1">$1</h2>')
        .replace(/^\*\s(.*)$/gm, '<li class="ml-4 list-disc text-slate-300">$1</li>')
        .replace(/\n\n/g, '<p class="mt-2"></p>')
        .replace(/\n/g, '<br/>');
    }

    // ON-CLICK: ZERO-DELAY INSTANT OPEN
    function onMediaClick(event, videoId) {
      if (event) event.preventDefault();
      markAsRead(videoId);
      openLaymansNews(videoId);
    }

    async function openLaymansNews(videoId) {
      const video = allVideos.find(v => v.id === videoId);
      if (!video) return;

      const outputBox = document.getElementById(`output-${videoId}`);
      outputBox.classList.remove('hidden');

      // 1. Instant Render if Pre-compiled by GitHub Server
      if (video.layman_news && video.layman_news.trim().length > 0) {
        renderOutput(videoId, video.layman_news, "Layman's News Read");
        return;
      }

      // 2. Immediate Client-Side Fallback if Still Processing on Server
      outputBox.innerHTML = `
        <div class="flex items-center gap-2 text-indigo-400">
          <i class="fa-solid fa-circle-notch fa-spin"></i>
          <span>Gemini compiling news briefing...</span>
        </div>`;

      const prompt = `Rewrite this video event as a simple, engaging news story for a regular person:
Format exactly like this:
## [Catchy Clear News Headline]
**The Story in Brief:** 2-3 short, clear sentences explaining what just happened in simple everyday words.
**Why It Matters to You:** 1-2 simple sentences explaining the real-world impact on everyday citizens.

Video Title: "${video.title}"
Channel: "${video.channel_title}"
Context / Description: ${video.description.slice(0, 1800)}`;

      try {
        const text = await callGemini(prompt);
        video.layman_news = text; // Cache in memory
        renderOutput(videoId, text, "Layman's News Read");
      } catch (err) {
        if (err.message === "GEMINI_KEY_REQUIRED") {
          promptApiKey();
          outputBox.classList.add('hidden');
        } else {
          outputBox.innerHTML = `<div class="text-rose-400 text-xs">${err.message}</div>`;
        }
      }
    }

    function renderOutput(videoId, text, title) {
      const box = document.getElementById(`output-${videoId}`);
      box.innerHTML = `
        <div class="flex items-center justify-between pb-1.5 border-b border-slate-700/60 mb-2">
          <span class="text-[11px] font-semibold text-teal-300 flex items-center gap-1">
            <i class="fa-solid fa-newspaper text-amber-400"></i> ${title}
          </span>
          <button onclick="document.getElementById('output-${videoId}').classList.add('hidden')" class="text-slate-500 hover:text-slate-300 text-xs">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="prose-slate text-xs space-y-1.5">${formatMarkdown(text)}</div>
        
        <!-- Next Tier Escalation Deck -->
        <div class="mt-3 pt-2.5 border-t border-slate-800/80 flex flex-wrap items-center gap-1.5">
          <span class="text-[10px] text-slate-500 uppercase tracking-wider font-semibold mr-1">Deepen:</span>
          <button onclick="triggerAnalysis('${videoId}', 'specific')" class="pill-btn px-2.5 py-1 rounded bg-sky-950/50 hover:bg-sky-900 border border-sky-800/60 text-[11px] text-sky-300">
            <i class="fa-solid fa-layer-group text-[10px]"></i> Specific Knowledge
          </button>
          <button onclick="triggerAnalysis('${videoId}', 'upsc')" class="pill-btn px-2.5 py-1 rounded bg-amber-950/50 hover:bg-amber-900 border border-amber-800/60 text-[11px] text-amber-300">
            <i class="fa-solid fa-landmark text-[10px]"></i> UPSC Curated
          </button>
          <button onclick="generateVideoQuestions('${videoId}')" class="pill-btn px-2.5 py-1 rounded bg-purple-950/50 hover:bg-purple-900 border border-purple-800/60 text-[11px] text-purple-300">
            <i class="fa-solid fa-wand-magic-sparkles text-[10px]"></i> Smart Questions
          </button>
        </div>
      `;
    }

    function triggerAnalysis(videoId, type) {
      markAsRead(videoId);
      const box = document.getElementById(`output-${videoId}`);
      box.classList.remove('hidden');
      box.innerHTML = `<span class="text-indigo-400 text-xs flex items-center gap-1.5"><i class="fa-solid fa-circle-notch fa-spin"></i> Analyzing...</span>`;

      const video = allVideos.find(v => v.id === videoId);
      if (!video) return;

      let prompt = type === 'specific' 
        ? `Break down institutions, data points, and mechanisms for: "${video.title}"\nContext: ${video.description.slice(0, 1500)}`
        : `Provide Prelims facts, Mains syllabus link, and 2-point conclusion for: "${video.title}"\nContext: ${video.description.slice(0, 1500)}`;

      const title = type === 'specific' ? "Specific Knowledge Simplified" : "UPSC Curated Analysis";

      callGemini(prompt).then(text => {
        renderOutput(videoId, text, title);
      }).catch(e => {
        box.innerHTML = `<div class="text-rose-400 text-xs">${e.message}</div>`;
      });
    }

    function renderGrid() {
      const readSet = getReadSet();
      const cutoff24 = new Date(Date.now() - 24 * 60 * 60 * 1000);

      let filtered = allVideos;
      if (currentFilter !== 'ALL') filtered = filtered.filter(v => v.channel_title === currentFilter);
      if (onlyLast24Hours) filtered = filtered.filter(v => new Date(v.published_at) >= cutoff24);

      updateReadStatsDisplay();

      const grid = document.getElementById('videoGrid');
      if (!filtered.length) {
        grid.innerHTML = `<div class="col-span-full text-center text-slate-500 py-12 text-sm">No updates match this filter.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(item => {
        const isRead = readSet.has(item.id);
        const timeAgo = formatTimeAgo(item.published_at);
        const hasServerSummary = Boolean(item.layman_news && item.layman_news.trim().length > 0);

        return `
        <div id="card-${item.id}" class="card-glow bg-[#131b2e] rounded-xl overflow-hidden flex flex-col justify-between shadow-lg ${isRead ? 'opacity-85' : ''}">
          <div>
            <!-- Clickable Thumbnail (Opens Layman's News Read Directly) -->
            <div onclick="onMediaClick(event, '${item.id}')" class="relative aspect-video w-full bg-slate-950 overflow-hidden cursor-pointer group">
              <img src="${item.thumbnail_url}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy" />
              <div class="absolute inset-0 bg-slate-950/20 group-hover:bg-slate-950/40 transition flex items-center justify-center">
                <span class="opacity-0 group-hover:opacity-100 transition bg-black/80 backdrop-blur-md text-teal-300 text-xs px-3 py-1.5 rounded-lg border border-teal-500/40 font-medium">
                  <i class="fa-solid fa-newspaper text-teal-400 mr-1"></i> Read Story
                </span>
              </div>
              <div class="absolute top-2 left-2 px-2 py-0.5 rounded text-[11px] font-semibold bg-black/75 backdrop-blur-md text-slate-200 border border-white/10 flex items-center gap-1.5">
                ${!isRead ? `<span id="readDot-${item.id}" class="unread-indicator"></span>` : ''}
                ${item.channel_title}
              </div>
              <div class="absolute bottom-2 right-2 px-2 py-0.5 rounded text-[10px] font-medium bg-black/80 backdrop-blur-md text-slate-300">
                ${timeAgo}
              </div>
              ${hasServerSummary ? `
                <span class="absolute bottom-2 left-2 px-2 py-0.5 rounded text-[10px] font-semibold bg-emerald-950/90 text-emerald-300 border border-emerald-800">
                  Layman Ready
                </span>` : ''}
            </div>

            <div class="p-4">
              <div class="flex items-start justify-between gap-2 mb-1.5">
                <!-- Clickable Heading (Opens Layman's News Read Directly) -->
                <h2 onclick="onMediaClick(event, '${item.id}')" class="text-sm font-semibold text-slate-100 line-clamp-2 leading-snug hover:text-sky-400 cursor-pointer transition">
                  ${item.title}
                </h2>
                <button id="readBtn-${item.id}" onclick="toggleRead('${item.id}')" class="text-xs shrink-0 px-2 py-1 rounded bg-slate-900 border border-slate-800 ${isRead ? 'text-emerald-400' : 'text-slate-400'}">
                  ${isRead ? '<i class="fa-solid fa-check text-emerald-400"></i> Read' : '<i class="fa-regular fa-circle text-sky-400"></i> Mark Read'}
                </button>
              </div>
              <p class="text-xs text-slate-400 line-clamp-2 leading-relaxed">${item.description || 'No description provided.'}</p>
            </div>
          </div>

          <div class="border-t border-slate-800/80 bg-[#0d1424] p-3 rounded-b-xl flex items-center justify-between">
            <button onclick="onMediaClick(null, '${item.id}')" class="pill-btn px-3 py-1.5 rounded-lg bg-teal-950/50 hover:bg-teal-900 text-xs text-teal-300 border border-teal-800/60 font-medium flex items-center gap-1.5">
              <i class="fa-solid fa-newspaper text-teal-400"></i> Read Layman's News
            </button>
            <a href="https://www.youtube.com/watch?v=${item.id}" target="_blank" rel="noopener noreferrer" class="pill-btn px-2.5 py-1.5 rounded-lg bg-red-950/40 text-red-400 hover:bg-red-900/60 border border-red-900/50 text-xs flex items-center gap-1" title="Watch Original on YouTube">
              <i class="fa-brands fa-youtube"></i> Video
            </a>
          </div>

          <div id="aiQuestions-${item.id}" class="hidden p-2 bg-[#141d33] border-t border-purple-900/50 flex flex-wrap gap-1.5"></div>
          <div id="output-${item.id}" class="hidden p-3.5 bg-[#162035] border-t border-indigo-900/50 text-xs text-slate-300 leading-relaxed"></div>
        </div>`;
      }).join('');
    }

    function formatTimeAgo(isoString) {
      try {
        const diff = (Date.now() - new Date(isoString).getTime()) / 1000;
        if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
        if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
        return `${Math.floor(diff / 86400)}d ago`;
      } catch (e) {
        return "";
      }
    }

    async function generateVideoQuestions(videoId) {
      markAsRead(videoId);
      const video = allVideos.find(v => v.id === videoId);
      if (!video) return;

      const container = document.getElementById(`aiQuestions-${videoId}`);
      container.classList.remove('hidden');
      container.innerHTML = `<span class="text-[11px] text-purple-300 flex items-center gap-1"><i class="fa-solid fa-circle-notch fa-spin text-purple-400"></i> Formulating smart questions...</span>`;

      const prompt = `Based on: "${video.title}" and context: "${video.description.slice(0, 1500)}", write 3 sharp analytical questions. Return ONLY valid JSON array with 3 short strings: ["Q1?", "Q2?", "Q3?"]`;

      try {
        const raw = await callGemini(prompt);
        const match = raw.match(/\[.*\]/s);
        const questions = JSON.parse(match ? match[0] : raw);

        container.innerHTML = `
          <div class="w-full text-[10px] uppercase font-semibold tracking-wider text-purple-400 mb-1 flex items-center gap-1">
            <i class="fa-solid fa-wand-magic-sparkles"></i> AI Suggested Inquiries:
          </div>
          ${questions.map(q => `
            <button onclick="executeCustomPrompt('${videoId}', ${JSON.stringify(q)})" 
              class="pill-btn text-left px-2 py-1 rounded bg-purple-950/60 hover:bg-purple-900 border border-purple-800 text-[11px] text-purple-200">
              ⚡ ${q}
            </button>
          `).join('')}
        `;
      } catch (e) {
        container.innerHTML = `<span class="text-[11px] text-rose-400">Could not generate questions. Tap to retry.</span>`;
      }
    }

    function executeCustomPrompt(videoId, query) {
      const box = document.getElementById(`output-${videoId}`);
      box.classList.remove('hidden');
      box.innerHTML = `<span class="text-indigo-400 flex items-center gap-1.5"><i class="fa-solid fa-circle-notch fa-spin"></i> Analyzing...</span>`;

      const video = allVideos.find(v => v.id === videoId);
      const prompt = `Video Title: "${video.title}"\nDescription: ${video.description.slice(0, 1500)}\nUser Question: "${query}"\nProvide a direct, high-yield answer.`;

      callGemini(prompt).then(text => {
        renderOutput(videoId, text, query);
      }).catch(err => {
        box.innerHTML = `<div class="text-rose-400 text-xs">${err.message}</div>`;
      });
    }

    // MASTER ENGINE
    function submitMasterQuery() {
      const input = document.getElementById('masterInput');
      const q = input.value.trim();
      if (q) runMasterQuery(q);
    }

    async function runMasterQuery(query) {
      const box = document.getElementById('masterOutput');
      box.classList.remove('hidden');
      box.innerHTML = `
        <div class="flex items-center gap-2 text-indigo-400">
          <i class="fa-solid fa-circle-notch fa-spin"></i>
          <span>Master Gemini synthesizing across briefings...</span>
        </div>`;

      const contextSummary = allVideos.slice(0, 16).map((v, i) => 
        `[${i+1}] Channel: ${v.channel_title} | Title: ${v.title} | Snippet: ${v.description.slice(0, 250)}`
      ).join('\n');

      const masterPrompt = `You are the Master Geopolitical & Current Affairs AI Engine.
Context from active dashboard video reports:
${contextSummary}

User Request: "${query}"

Provide an authoritative, well-structured intelligence report with bold headings and concise bullet points.`;

      try {
        const text = await callGemini(masterPrompt);
        box.innerHTML = `
          <div class="flex items-center justify-between pb-2 border-b border-indigo-800/60 mb-2">
            <span class="font-semibold text-indigo-300 flex items-center gap-1.5">
              <i class="fa-solid fa-brain text-amber-400"></i> ${query}
            </span>
            <button onclick="document.getElementById('masterOutput').classList.add('hidden')" class="text-slate-400 hover:text-white">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <div class="prose-slate text-xs space-y-1.5 leading-relaxed">${formatMarkdown(text)}</div>
        `;
      } catch (err) {
        if (err.message === "GEMINI_KEY_REQUIRED") {
          promptApiKey();
          box.classList.add('hidden');
        } else {
          box.innerHTML = `<div class="text-rose-400 text-xs">${err.message}</div>`;
        }
      }
    }

    loadFeed();
  </script>
</body>
</html>
