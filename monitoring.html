<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoIntel Hub | Channel Monitoring</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #080c16; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .card-border { border: 1px solid #1e293b; }
    .pill-btn { transition: all 0.15s ease; }
    .pill-btn:active { transform: scale(0.96); }
  </style>
</head>
<body class="min-h-screen pb-20">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-[#0a0f1d]/95 backdrop-blur-md border-b border-slate-800 px-4 py-3 sm:px-8">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="h-9 w-9 rounded-lg bg-teal-600 flex items-center justify-center text-white shadow-lg shadow-teal-500/30">
          <i class="fa-solid fa-tower-broadcast text-lg"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-white tracking-tight flex items-center gap-2">
            Channel Monitor
            <span class="text-xs font-semibold px-2 py-0.5 rounded bg-teal-950 text-teal-400 border border-teal-800">2-Hour Telemetry</span>
          </h1>
          <p class="text-xs text-slate-400">Trigger Logs, Active Channels & Extracted Topics</p>
        </div>
      </div>

      <!-- Navigation Links -->
      <div class="flex items-center gap-2">
        <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-lg flex items-center gap-1.5 font-medium transition">
          <i class="fa-solid fa-table-cells-large text-indigo-400"></i> Master Grid
        </a>
        <a href="headings.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-lg flex items-center gap-1.5 font-medium transition">
          <i class="fa-solid fa-list-ul text-sky-400"></i> Headings View
        </a>
        <button onclick="loadTelemetry()" class="text-xs bg-teal-950/80 hover:bg-teal-900 text-teal-300 border border-teal-800 px-3 py-1.5 rounded-lg flex items-center gap-1.5 font-medium transition">
          <i class="fa-solid fa-arrows-rotate text-teal-400"></i> Refresh Logs
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-8 pt-6 space-y-6">

    <!-- Active / Most Recent 2-Hour Cycle Container -->
    <section>
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <span class="h-2.5 w-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <h2 class="text-sm font-bold text-white uppercase tracking-wider">Latest 2-Hour Run Summary</h2>
        </div>
        <span id="cycleStatusBadge" class="text-xs font-medium text-slate-400 bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-md">Checking telemetry...</span>
      </div>

      <div id="latestCycleCard" class="bg-[#0e1628] card-border rounded-2xl p-5 shadow-xl">
        <div class="py-12 text-center text-slate-500 text-xs">
          <i class="fa-solid fa-circle-notch fa-spin text-xl text-teal-400 mb-2"></i>
          <p>Loading cycle telemetry...</p>
        </div>
      </div>
    </section>

    <!-- Past Cycles Hidden Section -->
    <section class="pt-2 border-t border-slate-800/80">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h3 class="text-sm font-semibold text-slate-200 flex items-center gap-2">
            <i class="fa-solid fa-clock-rotate-left text-sky-400"></i> Previous Cycle Archives
          </h3>
          <p class="text-xs text-slate-500">History of the preceding two 2-hour automation cycles</p>
        </div>
        
        <!-- Toggle Button to reveal/hide past 2 cycles -->
        <button id="toggleHistoryBtn" onclick="togglePastHistory()" class="pill-btn px-3.5 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-700 text-xs text-sky-300 font-medium flex items-center gap-2">
          <i id="historyIcon" class="fa-solid fa-chevron-down text-sky-400"></i>
          <span id="historyBtnLabel">View Past 2 Cycles</span>
        </button>
      </div>

      <div id="pastCyclesContainer" class="hidden space-y-5">
        <!-- Rendered via JS -->
      </div>
    </section>

  </main>

  <script>
    let cyclesData = [];
    let historyExpanded = false;

    async function loadTelemetry() {
      const card = document.getElementById('latestCycleCard');
      const badge = document.getElementById('cycleStatusBadge');
      card.innerHTML = `
        <div class="py-12 text-center text-slate-500 text-xs">
          <i class="fa-solid fa-circle-notch fa-spin text-xl text-teal-400 mb-2"></i>
          <p>Syncing cycle telemetry...</p>
        </div>`;

      try {
        const res = await fetch(`cycles.json?t=${new Date().getTime()}`);
        if (!res.ok) throw new Error("cycles.json not generated yet");
        cyclesData = await res.json();

        if (!cyclesData || cyclesData.length === 0) {
          card.innerHTML = `<div class="py-8 text-center text-slate-400 text-xs">No cycle history recorded yet. Trigger the workflow or wait for next 2h run.</div>`;
          badge.innerText = "No Records";
          return;
        }

        renderLatestCycle(cyclesData[0]);
        renderPastCycles(cyclesData.slice(1, 3));
      } catch (e) {
        card.innerHTML = `
          <div class="py-8 text-center text-slate-400 text-xs space-y-1">
            <i class="fa-solid fa-circle-info text-amber-400 text-lg mb-1"></i>
            <p class="font-medium text-slate-200">First Telemetry Cycle Pending</p>
            <p class="text-slate-500">Telemetry file (cycles.json) will be generated on the next 2-hour automation cycle.</p>
          </div>`;
        badge.innerText = "Pending Initial Run";
      }
    }

    function renderLatestCycle(cycle) {
      const card = document.getElementById('latestCycleCard');
      const badge = document.getElementById('cycleStatusBadge');
      const triggerDate = new Date(cycle.timestamp);
      badge.innerText = `Triggered: ${formatTimeAgo(cycle.timestamp)}`;

      const channelsList = cycle.channels || [];
      const hasUploads = channelsList.length > 0;

      card.innerHTML = `
        <div class="flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-slate-800">
          <div>
            <div class="text-[11px] text-teal-400 font-semibold uppercase tracking-wider mb-1">Execution Timestamp</div>
            <div class="text-base font-bold text-white flex items-center gap-2">
              <i class="fa-regular fa-calendar-check text-teal-400"></i> ${triggerDate.toLocaleString()}
            </div>
          </div>
          <div class="flex items-center gap-3">
            <div class="bg-[#121c33] border border-slate-700/80 px-3.5 py-2 rounded-xl text-center">
              <div class="text-xs text-slate-400">Channels Active</div>
              <div class="text-base font-bold text-sky-400">${cycle.active_channels_count || 0} / 25</div>
            </div>
            <div class="bg-[#121c33] border border-slate-700/80 px-3.5 py-2 rounded-xl text-center">
              <div class="text-xs text-slate-400">New Videos Harvested</div>
              <div class="text-base font-bold text-emerald-400">${cycle.total_new_videos || 0}</div>
            </div>
          </div>
        </div>

        <div class="mt-4">
          <div class="text-xs font-semibold text-slate-300 mb-3 flex items-center gap-2">
            <i class="fa-solid fa-list-check text-teal-400"></i> Channel Uploads & Selected Topics (This Cycle)
          </div>

          ${!hasUploads ? `
            <div class="py-6 text-center text-slate-500 text-xs bg-[#090d16] rounded-xl border border-slate-800">
              No new video uploads were published across the 25 channels during this 2-hour window.
            </div>
          ` : `
            <div class="space-y-3">
              ${channelsList.map(ch => `
                <div class="bg-[#090e1a] rounded-xl border border-slate-800/80 p-3.5 hover:border-teal-700/50 transition">
                  <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-bold text-white flex items-center gap-1.5">
                      <i class="fa-brands fa-youtube text-red-500"></i> ${ch.channel_name}
                      <span class="text-[11px] font-normal text-slate-400">(${ch.handle})</span>
                    </span>
                    <span class="text-[11px] bg-teal-950 text-teal-300 border border-teal-800 px-2 py-0.5 rounded font-semibold">
                      ${ch.video_count} ${ch.video_count === 1 ? 'upload' : 'uploads'}
                    </span>
                  </div>
                  <ul class="space-y-1.5 pl-2 border-l-2 border-slate-800">
                    ${(ch.topics || []).map(t => `
                      <li class="text-xs text-slate-300 flex items-start gap-2">
                        <i class="fa-solid fa-angle-right text-teal-400 text-[10px] mt-1 shrink-0"></i>
                        <span class="leading-snug">${t}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      `;
    }

    function renderPastCycles(pastList) {
      const container = document.getElementById('pastCyclesContainer');
      if (!pastList || pastList.length === 0) {
        container.innerHTML = `<div class="p-6 text-center text-slate-500 text-xs bg-[#0e1628] rounded-xl border border-slate-800">No past cycles available yet.</div>`;
        return;
      }

      container.innerHTML = pastList.map((cycle, idx) => {
        const triggerDate = new Date(cycle.timestamp);
        const channelsList = cycle.channels || [];
        const hasUploads = channelsList.length > 0;

        return `
          <div class="bg-[#0b101c] card-border rounded-xl p-4">
            <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-800/80">
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-sky-400">Cycle -${idx + 1}</span>
                <span class="text-xs text-slate-400">• ${triggerDate.toLocaleString()}</span>
                <span class="text-[11px] text-slate-500">(${formatTimeAgo(cycle.timestamp)})</span>
              </div>
              <div class="text-xs text-slate-300">
                <span class="text-emerald-400 font-semibold">${cycle.total_new_videos || 0}</span> uploads from 
                <span class="text-sky-400 font-semibold">${cycle.active_channels_count || 0}</span> channels
              </div>
            </div>

            <div class="mt-3">
              ${!hasUploads ? `
                <p class="text-xs text-slate-500 italic">No new uploads in this cycle.</p>
              ` : `
                <div class="space-y-2 mt-2">
                  ${channelsList.map(ch => `
                    <div class="bg-[#080c16] rounded-lg p-2.5 border border-slate-800">
                      <div class="flex items-center justify-between text-xs font-semibold text-slate-200 mb-1">
                        <span>${ch.channel_name}</span>
                        <span class="text-[10px] text-slate-400">${ch.video_count} videos</span>
                      </div>
                      <div class="text-[11px] text-slate-400 space-y-1 pl-2 border-l border-slate-700">
                        ${(ch.topics || []).map(t => `<div>• ${t}</div>`).join('')}
                      </div>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    function togglePastHistory() {
      const container = document.getElementById('pastCyclesContainer');
      const label = document.getElementById('historyBtnLabel');
      const icon = document.getElementById('historyIcon');
      historyExpanded = !historyExpanded;

      if (historyExpanded) {
        container.classList.remove('hidden');
        label.innerText = "Hide Past Cycles";
        icon.classList.remove('fa-chevron-down');
        icon.classList.add('fa-chevron-up');
      } else {
        container.classList.add('hidden');
        label.innerText = "View Past 2 Cycles";
        icon.classList.remove('fa-chevron-up');
        icon.classList.add('fa-chevron-down');
      }
    }

    function formatTimeAgo(isoString) {
      try {
        const diff = (Date.now() - new Date(isoString).getTime()) / 1000;
        if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
        if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
        return `${Math.floor(diff / 86400)}d ago`;
      } catch (e) {
        return "";
      }
    }

    loadTelemetry();
  </script>
</body>
</html>
